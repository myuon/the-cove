<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Cove</title>
<style>
  :root {
    color-scheme: dark;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: #071b21;
    overflow: hidden;
  }
  /* The panel sits beside the tank and never over it. A reef the visitor is
     reading through a translucent panel is a third of a reef. */
  body {
    display: flex;
    align-items: stretch;
  }
  #tank {
    flex: 1 1 auto;
    display: block;
    min-width: 0;
  }
  #panel {
    flex: 0 0 300px;
    order: -1;
    height: 100vh;
    box-sizing: border-box;
    overflow-y: auto;
    background: #06171d;
    border-right: 1px solid rgba(255, 255, 255, 0.12);
    padding: 16px 16px 20px;
    color: #e8f4f2;
    font-size: 13px;
    line-height: 1.45;
  }
  #panel h1 {
    font-size: 15px;
    margin: 0 0 10px;
  }
  /* On a narrow screen the panel goes under the tank rather than squeezing
     it: the reef is what the page is for. */
  @media (max-width: 720px) {
    body { flex-direction: column; }
    #panel { flex: 0 0 auto; order: 1; height: auto; border-right: none;
             border-top: 1px solid rgba(255, 255, 255, 0.12); }
    #tank { flex: 1 1 auto; }
  }
  #controls {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
  }
  #controls button {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.18);
    color: #e8f4f2;
    border-radius: 6px;
    padding: 4px 9px;
    font-size: 12px;
    cursor: pointer;
  }
  #controls button.active {
    background: #3d8b7a;
    border-color: #3d8b7a;
  }
  #controls button:hover {
    border-color: rgba(255, 255, 255, 0.4);
  }
  dl {
    display: grid;
    grid-template-columns: auto auto;
    gap: 2px 10px;
    margin: 0 0 10px;
  }
  dl dt {
    opacity: 0.65;
  }
  dl dd {
    margin: 0;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  #legend {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #legend li {
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }
  #legend canvas {
    flex: none;
    margin-top: 1px;
  }
  #legend .name {
    font-weight: 600;
  }
  #legend .summary {
    opacity: 0.8;
  }
  #hint {
    margin-top: 10px;
    opacity: 0.55;
    font-size: 11px;
  }
</style>
</head>
<body>
<canvas id="tank"></canvas>
<div id="panel">
  <h1>The Cove</h1>
  <div id="controls">
    <button id="playPause" type="button">Pause</button>
    <button data-speed="0.5" type="button">0.5x</button>
    <button data-speed="1" type="button" class="active">1x</button>
    <button data-speed="2" type="button">2x</button>
    <button data-speed="4" type="button">4x</button>
    <button id="newWorld" type="button">New world</button>
  </div>
  <dl>
    <dt>Seed</dt><dd id="statSeed">–</dd>
    <dt>Tick</dt><dd id="statTick">–</dd>
    <dt>Creatures</dt><dd id="statCreatures">–</dd>
    <dt>Births / deaths</dt><dd id="statTurnover">–</dd>
    <dt>Decisions/s</dt><dd id="statDecisions">–</dd>
    <dt>Instructions/tick</dt><dd id="statInstructions">–</dd>
    <dt>Fuel/tick</dt><dd id="statFuel">–</dd>
    <dt>Cove &micro;s/tick</dt><dd id="statMicros">–</dd>
    <dt>Failures</dt><dd id="statFailures">–</dd>
  </dl>
  <ul id="legend"></ul>
  <p id="hint">Space to pause. The hatched cells are kelp: a creature can hide there, and a hunter will not follow prey in.</p>
</div>
<script type="module" src="dist/main.js"></script>
</body>
</html>
